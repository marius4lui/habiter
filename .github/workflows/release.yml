name: Publish Habiter Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without publishing or deploying
        required: true
        type: boolean
        default: true
      version:
        description: SemVer to validate during a dry run
        required: true
        default: '1.5.0'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.version || 'tag' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = push ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$INPUT_VERSION"; fi
          CHANNEL=$(jq -r --arg version "$VERSION" '.releases[] | select(.version == $version) | .channel' packages/release-core/data/releases.json)
          case "$CHANNEL" in stable|beta) ;; *) echo "Invalid release channel: $CHANNEL" >&2; exit 1;; esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - env:
          TAG: ${{ steps.version.outputs.tag }}
        run: pnpm release:validate --tag="$TAG"
      - name: Require release commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Refuse an existing release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi

  android:
    name: Build Signed Android
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/habiter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: apps/habiter/android/*.gradle*
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          chmod 600 android/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/key.properties
      - run: flutter pub get --enforce-lockfile
      - name: Build distribution-specific Android artifacts
        env:
          HABITER_UPDATE_PUBLIC_KEYS: ${{ vars.HABITER_UPDATE_PUBLIC_KEYS }}
          RELEASE_MANIFEST_KEY_ID: ${{ vars.RELEASE_MANIFEST_KEY_ID }}
        run: |
          node ../../scripts/release/validate-public-key-ring.mjs
          flutter build apk --release --flavor direct --dart-define="HABITER_UPDATE_PUBLIC_KEYS=$HABITER_UPDATE_PUBLIC_KEYS"
          flutter build appbundle --release --flavor store --dart-define="HABITER_UPDATE_PUBLIC_KEYS=$HABITER_UPDATE_PUBLIC_KEYS"
          ../../scripts/android/verify-update-flavors.sh \
            build/app/intermediates/merged_manifests directRelease storeRelease
      - name: Name and verify signed artifacts
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-direct-release.apk "dist/habiter-$VERSION-android-universal.apk"
          cp build/app/outputs/bundle/storeRelease/app-store-release.aab "dist/habiter-$VERSION-android-playstore.aab"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -n "$EXPECTED_SHA256"
          CERT_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "dist/habiter-$VERSION-android-universal.apk")
          printf '%s\n' "$CERT_OUTPUT"
          NORMALIZED_EXPECTED=$(printf '%s' "$EXPECTED_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          NORMALIZED_OUTPUT=$(printf '%s' "$CERT_OUTPUT" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          printf '%s' "$NORMALIZED_OUTPUT" | grep -F "$NORMALIZED_EXPECTED"
          AAB="dist/habiter-$VERSION-android-playstore.aab"
          jarsigner -verify "$AAB"
          AAB_CERT=$(keytool -printcert -jarfile "$AAB")
          printf '%s\n' "$AAB_CERT"
          NORMALIZED_AAB_CERT=$(printf '%s' "$AAB_CERT" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          printf '%s' "$NORMALIZED_AAB_CERT" | grep -F "$NORMALIZED_EXPECTED"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: apps/habiter/dist/*
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties

  linux:
    name: Build Linux x64
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/habiter
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebkit2gtk-4.1-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - env:
          HABITER_UPDATE_PUBLIC_KEYS: ${{ vars.HABITER_UPDATE_PUBLIC_KEYS }}
          RELEASE_MANIFEST_KEY_ID: ${{ vars.RELEASE_MANIFEST_KEY_ID }}
        run: |
          node ../../scripts/release/validate-public-key-ring.mjs
          flutter build linux --release --dart-define="HABITER_UPDATE_PUBLIC_KEYS=$HABITER_UPDATE_PUBLIC_KEYS"
      - env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: tar -C build/linux/x64/release/bundle -czf "habiter-$VERSION-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: apps/habiter/habiter-*-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    name: Build Windows x64
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/habiter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - shell: pwsh
        env:
          HABITER_UPDATE_PUBLIC_KEYS: ${{ vars.HABITER_UPDATE_PUBLIC_KEYS }}
          RELEASE_MANIFEST_KEY_ID: ${{ vars.RELEASE_MANIFEST_KEY_ID }}
        run: |
          node ../../scripts/release/validate-public-key-ring.mjs
          flutter build windows --release --dart-define="HABITER_UPDATE_PUBLIC_KEYS=$env:HABITER_UPDATE_PUBLIC_KEYS"
      - shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "habiter-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: apps/habiter/habiter-*-windows-x64.zip
          if-no-files-found: error

  macos:
    name: Build macOS universal
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/habiter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - env:
          HABITER_UPDATE_PUBLIC_KEYS: ${{ vars.HABITER_UPDATE_PUBLIC_KEYS }}
          RELEASE_MANIFEST_KEY_ID: ${{ vars.RELEASE_MANIFEST_KEY_ID }}
        run: |
          node ../../scripts/release/validate-public-key-ring.mjs
          flutter build macos --release --dart-define="HABITER_UPDATE_PUBLIC_KEYS=$HABITER_UPDATE_PUBLIC_KEYS"
      - env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/habiter.app "habiter-$VERSION-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: apps/habiter/habiter-*-macos-universal.zip
          if-no-files-found: error

  publish:
    name: Publish Atomic Release
    needs: [validate, android, linux, windows, macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Generate release metadata
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PUBLISHED_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          if [ -d "packages/release-core/media/$VERSION" ]; then cp packages/release-core/media/$VERSION/* artifacts/; fi
          node scripts/release/render-notes.mjs "$VERSION" > release-notes.md
          node scripts/release/enrich-artifacts.mjs "$VERSION" artifacts runtime-releases.json
          (cd artifacts && sha256sum * > "habiter-$VERSION-checksums.txt")
          cp runtime-releases.json artifacts/releases.json
      - name: Create draft release with every asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          PRERELEASE_ARGS=()
          if [ "$CHANNEL" = beta ]; then PRERELEASE_ARGS+=(--prerelease); fi
          for ATTEMPT in {1..5}; do
            if gh release create "$TAG" artifacts/* --draft "${PRERELEASE_ARGS[@]}" --title "Habiter $VERSION" --notes-file release-notes.md --verify-tag; then
              break
            fi
            if gh release view "$TAG" --json isDraft --jq '.isDraft' | grep -qx true; then
              echo "Draft release $TAG already exists after a transient create failure"
              break
            fi
            if [ "$ATTEMPT" = 5 ]; then echo "Could not create draft release $TAG" >&2; exit 1; fi
            sleep $((ATTEMPT * 5))
          done
      - name: Deploy release metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_MANIFEST_KEY_ID: ${{ vars.RELEASE_MANIFEST_KEY_ID }}
          RELEASE_MANIFEST_PRIVATE_KEY_BASE64: ${{ secrets.RELEASE_MANIFEST_PRIVATE_KEY_BASE64 }}
        run: |
          cp runtime-releases.json apps/release-api/src/generated/releases.json
          node scripts/release/sign-manifest.mjs runtime-releases.json apps/release-api/src/generated/manifest-envelope.json
          pnpm --filter @habiter/release-api types
          pnpm --filter @habiter/release-api check
          pnpm --dir apps/release-api exec wrangler deploy --env production
      - name: Smoke test release API
        if: ${{ vars.RELEASE_API_BASE_URL != '' }}
        env:
          RELEASE_API_BASE_URL: ${{ vars.RELEASE_API_BASE_URL }}
          VERSION: ${{ needs.validate.outputs.version }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          curl --fail --retry 5 --retry-all-errors --retry-delay 3 "$RELEASE_API_BASE_URL/health"
          for ATTEMPT in {1..30}; do
            CACHE_BUST="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ATTEMPT}"
            if curl --silent --show-error --fail "$RELEASE_API_BASE_URL/api/v1/manifest?cache_bust=$CACHE_BUST" \
              | jq --exit-status '.schemaVersion == 1 and .algorithm == "ed25519" and (.payload | length > 0) and (.signature | length > 0)'; then
              break
            fi
            if [ "$ATTEMPT" = 30 ]; then echo "Manifest endpoint did not converge" >&2; exit 1; fi
            sleep 3
          done
          for ATTEMPT in {1..30}; do
            CACHE_BUST="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ATTEMPT}"
            if curl --silent --show-error --fail "$RELEASE_API_BASE_URL/api/v1/releases/$VERSION?cache_bust=$CACHE_BUST" \
              | jq --exit-status --arg version "$VERSION" --arg channel "$CHANNEL" '.version == $version and .channel == $channel'; then
              break
            fi
            if [ "$ATTEMPT" = 30 ]; then echo "Release detail did not converge" >&2; exit 1; fi
            sleep 3
          done
          for ATTEMPT in {1..30}; do
            CACHE_BUST="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ATTEMPT}"
            if curl --silent --show-error --fail "$RELEASE_API_BASE_URL/api/v1/releases/latest?channel=$CHANNEL&cache_bust=$CACHE_BUST" \
              | jq --exit-status --arg version "$VERSION" '.version == $version'; then
              break
            fi
            if [ "$ATTEMPT" = 30 ]; then echo "Latest release did not converge" >&2; exit 1; fi
            sleep 3
          done
      - name: Persist verified release metadata on main
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cp runtime-releases.json "$RUNNER_TEMP/runtime-releases.json"
          git restore apps/release-api/src/generated/releases.json
          git fetch origin main
          git switch -C "release/finalize-$VERSION" origin/main
          node scripts/release/finalize-manifest.mjs "$VERSION" "$RUNNER_TEMP/runtime-releases.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/release-core/data/releases.json
          git commit -m "release: finalize Habiter $VERSION"
          git push origin HEAD:main
      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          if [ "$CHANNEL" = beta ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
