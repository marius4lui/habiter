name: Deploy Release API

on:
  push:
    branches: [main]
    paths:
      - 'apps/release-api/**'
      - 'packages/release-core/**'
      - 'scripts/release/**'
      - 'scripts/install/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.13.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:validate
      - run: pnpm release:test
      - name: Prepare signed production manifest
        env:
          RELEASE_MANIFEST_KEY_ID: ${{ vars.RELEASE_MANIFEST_KEY_ID }}
          RELEASE_MANIFEST_PRIVATE_KEY_BASE64: ${{ secrets.RELEASE_MANIFEST_PRIVATE_KEY_BASE64 }}
        run: node scripts/release/sync-worker-data.mjs
      - run: pnpm --filter @habiter/release-api types
      - run: pnpm --filter @habiter/release-api check
      - name: Deploy production
        working-directory: apps/release-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env production
      - name: Smoke test custom domain
        if: ${{ vars.RELEASE_API_BASE_URL != '' }}
        env:
          RELEASE_API_BASE_URL: ${{ vars.RELEASE_API_BASE_URL }}
        run: |
          curl --fail --retry 5 --retry-all-errors --retry-delay 3 "$RELEASE_API_BASE_URL/health"
          curl --fail --retry 5 --retry-all-errors --retry-delay 3 "$RELEASE_API_BASE_URL/api/v1/releases"
          curl --fail --retry 5 --retry-all-errors --retry-delay 3 "$RELEASE_API_BASE_URL/api/v1/manifest"
      - name: Smoke test smart-download domain
        env:
          SMART_DOWNLOAD_BASE_URL: https://get-the.habiter.dev
        run: |
          location=$(curl --silent --show-error --fail --retry 5 --retry-all-errors --retry-delay 3 \
            --user-agent 'Mozilla/5.0 (Linux; Android 15)' \
            --output /dev/null --write-out '%{redirect_url}' "$SMART_DOWNLOAD_BASE_URL/")
          case "$location" in
            https://get.habiter.dev/api/v1/download/android/*) ;;
            *) echo "Unexpected smart-download redirect: $location" >&2; exit 1 ;;
          esac
          legacy=$(curl --silent --show-error --fail --retry 5 --retry-all-errors --retry-delay 3 \
            --output /dev/null --write-out '%{redirect_url}' \
            'https://get.habiter.dev/download?platform=android')
          test "$legacy" = "$SMART_DOWNLOAD_BASE_URL/?platform=android"
