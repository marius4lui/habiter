name: habiter
description: Flutter port of the Habiter mobile app (UI/UX parity, extensible for AI features)
publish_to: 'none'
version: 1.11.0+11100

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.2
  intl: 0.20.2
  fl_chart: ^1.2.0
  uuid: ^4.4.0
  collection: ^1.18.0
  crypto: ^3.0.7
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.0
  http: ^1.2.0
  flutter_secure_storage: ^10.3.1
  flutter_web_auth_2: ^5.0.0
  url_launcher: ^6.3.2
  desktop_webview_window: ^0.3.0
  home_widget: ^0.9.2
  cryptography: ^2.9.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
